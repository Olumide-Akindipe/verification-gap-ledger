name: Publish Python package

# Runs the tests and builds the package on every push and pull request.
# Publishes to PyPI only when started by hand (Actions tab, "Run workflow") or when a
# version tag such as v0.1.2 is pushed. Publishing uses PyPI Trusted Publishing, so no
# API token is stored in this repository.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine pytest
      - name: Test
        run: |
          python -m pip install -e .
          python -m pytest -q
      - name: Build
        run: python -m build
      - name: Check
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/verification-gap-ledger
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
